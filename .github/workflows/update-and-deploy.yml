name: Official data and GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 07:17 and 09:47 Taipei; second run retries delayed official statistics.
    - cron: '17 23 * * *'
    - cron: '47 1 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: basketball-pages
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Fetch official data and generate daily report
        run: python scripts/update.py
      - name: Validate generated data
        run: python scripts/validate.py
      - name: Save updated official data
        run: |
          git config user.name 'basketball-data-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if ! git diff --cached --quiet; then
            git commit -m 'Update official basketball data and daily report'
            git push
          fi
      - name: Source health summary
        run: |
          python -c "import json,os; d=json.load(open('data/site.json')); print('Source issues:', d['errors']); open(os.environ['GITHUB_STEP_SUMMARY'],'a').write('Official source issues: '+str(d['errors']))"
      - name: Build crawlable public HTML and daily report pages
        run: python scripts/build_public.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        uses: actions/deploy-pages@v4
        id: deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
